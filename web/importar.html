<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Importar datos · Birrapp</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    body { margin: 0; padding: 24px 16px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fffdf7; color: #0b1f35; }
    main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; }
    button { font: inherit; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none;
      background: #0b1f35; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; background: #f3f4f6;
      padding: 12px; border-radius: 8px; min-height: 3em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Importar datos</h1>
    <p>Copia los bares y precios de la versión anterior de Birrapp (Render) a esta. Solo lo puede hacer la cuenta del
      dueño de la app y se hace una vez; si se repite, los bares ya importados se saltan.</p>
    <p id="who">Comprobando sesión…</p>
    <button id="go" disabled>Importar</button>
    <div id="log" aria-live="polite"></div>
    <p><a href="/">Volver al mapa</a></p>
  </main>
  <script type="module" src="/importar.js"></script>
</body>
</html>
