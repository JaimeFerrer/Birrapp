services:
  - type: web
    name: birrapp
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/bars
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Se rellenan en el panel de Render con los datos de Turso.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
